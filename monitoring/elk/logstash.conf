# Logstash Configuration for BedaanWaves
# Parses and enriches log data before sending to Elasticsearch

input {
  kafka {
    bootstrap_servers => "localhost:9092"
    topics => ["bedaanwaves-logs"]
    group_id => "logstash"
    decorate_events => true
  }
}

filter {
  # Parse JSON log format
  json {
    source => "message"
  }

  # Extract timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Enrich with service information
  if [service] {
    mutate {
      add_field => { "service_name" => "%{[service]}" }
    }
  }

  # Categorize log levels
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_field => { "is_error" => true }
    }
  }

  # Extract trace_id and span_id for correlation
  if [trace_id] {
    mutate {
      add_field => { "trace_id" => "%{[trace_id]}" }
    }
  }

  if [span_id] {
    mutate {
      add_field => { "span_id" => "%{[span_id]}" }
    }
  }

  # GeoIP enrichment for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo_location"
    }
  }

  # User-Agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
    }
  }

  # Drop debug logs in production
  if [level] == "DEBUG" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "bedaanwaves-logs-%{+YYYY.MM.dd}"
    doc_as_upsert => true
    action => "index"
  }

  stdout {
    codec => rubydebug
  }
}