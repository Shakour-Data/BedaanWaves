# Alertmanager Configuration for BedaanWaves
# Configures alert routing, grouping, and notification

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'default'

receivers:
  - name: 'default'
    email_configs:
      - to: 'platform@bedaanwaves.com'
        send_resolved: true
        html: true
        headers:
          Subject: '[{{ .Status }}] BedaanWaves Alert: {{ .GroupLabels.alertname }}'

  - name: 'platform-team'
    email_configs:
      - to: 'platform@bedaanwaves.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#platform-alerts'
        send_resolved: true
        title: '[{{ .Status }}] BedaanWaves Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

  - name: 'critical-oncall'
    email_configs:
      - to: 'oncall@bedaanwaves.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#critical-alerts'
        send_resolved: true
        title: '[CRITICAL] BedaanWaves Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Team:* {{ .GroupLabels.team }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Runbook:* {{ range .Alerts }}{{ .Annotations.runbook }}{{ end }}

  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        send_resolved: true
        severity: 'critical'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']