# Alertmanager Configuration for BedaanWaves
# Configures alert routing, grouping, and notification

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: 'critical'
      receiver: 'critical-oncall'
      continue: true
    - match:
        severity: 'critical'
      receiver: 'incident-webhook'
      continue: false
    - match:
        severity: 'warning'
      receiver: 'platform-team'
      continue: false
    - match:
        severity: 'info'
      receiver: 'telegram-notifications'
      continue: false

receivers:
  - name: 'default'
    email_configs:
      - to: 'platform@bedaanwaves.com'
        send_resolved: true
        html: true
        headers:
          Subject: '[{{ .Status }}] BedaanWaves Alert: {{ .GroupLabels.alertname }}'

  - name: 'platform-team'
    email_configs:
      - to: 'platform@bedaanwaves.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#platform-alerts'
        send_resolved: true
        title: '[{{ .Status }}] BedaanWaves Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

  - name: 'critical-oncall'
    email_configs:
      - to: 'oncall@bedaanwaves.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#critical-alerts'
        send_resolved: true
        title: '[CRITICAL] BedaanWaves Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Team:* {{ .GroupLabels.team }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Runbook:* {{ range .Alerts }}{{ .Annotations.runbook }}{{ end }}
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        send_resolved: true
        severity: 'critical'

  - name: 'incident-webhook'
    webhook_configs:
      - url: 'http://localhost:3000/api/v1/system/incidents'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'incident-response'
            password: 'inc-integration-key'
        http_method: 'POST'
        title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
        description: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        chat_id: '@bedaanwaves_alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}🔥{{ end }}] {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']