# Prometheus Configuration for BedaanWaves
# This file configures Prometheus for metrics collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bedaanwaves-api'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    params:
      format: ['prometheus']

  - job_name: 'bedaanwaves-services'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: /api/v1/system/metrics
    scrape_interval: 10s
    scrape_timeout: 8s

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s
    scrape_timeout: 10s

rule_files:
  - "rules/*.yml"