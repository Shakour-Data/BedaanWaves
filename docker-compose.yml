# =============================================================================
# BedaanWaves — Docker Compose (full production-like stack)
# Services: PostgreSQL, Redis, Backend (FastAPI), Frontend (Next.js)
# =============================================================================
# Usage:
#   cp .env.docker.example .env.docker   # adjust secrets
#   docker compose --env-file .env.docker up --build -d
#   docker compose --env-file .env.docker logs -f
#
# The backend entrypoint runs `alembic upgrade head` before starting uvicorn,
# so the database schema is auto-applied on first start.
# =============================================================================

name: bedaanwaves

services:
  postgres:
    image: postgres:16-alpine
    container_name: bw-postgres
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-bedaanwaves_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bw-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bw-backend
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/data-health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: bw-frontend
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      - backend
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pg_data:
  redis_data:
