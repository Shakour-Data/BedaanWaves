# BedaanWaves Nginx Master Configuration
# Path: /etc/nginx/nginx.conf
# Include this in the `http {}` block of your main nginx.conf:
#
#   include /etc/nginx/conf.d/*.conf;
#   include /etc/nginx/sites-enabled/*;

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_support on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version
    server_tokens off;
    more_clear_headers 'Server';

    # Logging format with correlation ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_correlation_id" '
                    'rt=$request_time ut=$upstream_response_time '
                    'ct=$connection';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=30r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Cache for static assets
    proxy_cache_path /var/cache/nginx/bedaanwaves levels=1:2 keys_zone=bedaan_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # CORS headers map
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3005" "http://localhost:3005";
        "http://127.0.0.1:3005" "http://127.0.0.1:3005";
        "https://app.bedaanwaves.com" "https://app.bedaanwaves.com";
    }

    # Include site configuration
    include /etc/nginx/sites-enabled/*;
}