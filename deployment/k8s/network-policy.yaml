apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bedaanwaves-backend-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: bedaanwaves
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        ports:
          - protocol: TCP
            port: 8000
      # Allow health checks from monitoring
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: prometheus
        ports:
          - protocol: TCP
            port: 9090
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
        ports:
          - protocol: TCP
            port: 5432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: redis
        ports:
          - protocol: TCP
            port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: kafka
        ports:
          - protocol: TCP
            port: 9092
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
