apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: bedaanwaves
    tier: messaging
spec:
  selector:
    app: bedaanwaves
    tier: messaging
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: kafka-internal
    port: 29092
    targetPort: 29092
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: bedaanwaves
    tier: messaging
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: bedaanwaves
      tier: messaging
  template:
    metadata:
      labels:
        app: bedaanwaves
        tier: messaging
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.1
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 29092
          name: kafka-internal
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pod']
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: KAFKA_COMPRESSION_TYPE
          value: "snappy"
        - name: KAFKA_MESSAGE_MAX_BYTES
          value: "10485760"
        - name: KAFKA_REPLICA_FETCH_MAX_BYTES
          value: "10485760"
        - name: KAFKA_LOG_RETENTION_MS
          value: "604800000"
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: "1073741824"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - kafka-broker-api-versions.sh --bootstrap-server localhost:9092
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - kafka-broker-api-versions.sh --bootstrap-server localhost:9092
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: kafka-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
      storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
data:
  topics.yaml: |
    topics:
    - name: order-events
      partitions: 6
      replication-factor: 3
      config:
        retention.ms: 604800000
        cleanup.policy: delete
    - name: payment-events
      partitions: 6
      replication-factor: 3
      config:
        retention.ms: 604800000
        cleanup.policy: delete
    - name: inventory-events
      partitions: 6
      replication-factor: 3
      config:
        retention.ms: 604800000
        cleanup.policy: delete
    - name: notification-events
      partitions: 3
      replication-factor: 3
      config:
        retention.ms: 259200000
        cleanup.policy: delete
    - name: market-data-events
      partitions: 12
      replication-factor: 3
      config:
        retention.ms: 86400000
        cleanup.policy: delete
    - name: news-events
      partitions: 6
      replication-factor: 3
      config:
        retention.ms: 259200000
        cleanup.policy: delete
    - name: score-delta-events
      partitions: 6
      replication-factor: 3
      config:
        retention.ms: 86400000
        cleanup.policy: delete
    - name: orderbook-events
      partitions: 12
      replication-factor: 3
      config:
        retention.ms: 3600000
        cleanup.policy: delete
    - name: health-events
      partitions: 3
      replication-factor: 3
      config:
        retention.ms: 604800000
        cleanup.policy: delete