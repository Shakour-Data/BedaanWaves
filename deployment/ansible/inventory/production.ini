[production]
prod-server-1 ansible_host=$PROD_HOST_1 ansible_user=$PROD_USERNAME ansible_port=22
prod-server-2 ansible_host=$PROD_HOST_2 ansible_user=$PROD_USERNAME ansible_port=22

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/bedaanwaves_deploy
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[production:vars]
app_environment=production
app_port=3000
app_workers=4
nginx_port=3005
deploy_path=/opt/bedaanwaves/production
service_name=bedaanwaves-production
