# Redis Configuration for BedaanWaves
# ---------------------------------------------------------------------------
# Optimized for caching and session management

# =============================================================================
# NETWORK
# =============================================================================

# Accept connections on all interfaces (for Docker)
bind 0.0.0.0

# Port for Redis server
port 6379

# TCP listen() backlog
# Increase for high-traffic scenarios
tcp-backlog 511

# Unix socket (disabled for Docker)
# unixsocket /tmp/redis.sock

# Timeout for idle connections (seconds)
# Close connection after 5 minutes of inactivity
timeout 300

# TCP keepalive
tcp-keepalive 60

# =============================================================================
# GENERAL
# =============================================================================

# Run as daemon (disabled for Docker - managed by supervisor)
daemonize no

# PID file (managed by Docker)
# pidfile /var/run/redis_6379.pid

# Log level (debug, verbose, notice, warning)
loglevel notice

# Log file (stdout for Docker)
logfile ""

# Number of databases
# Using db 0 for cache, db 1 for sessions
databases 2

# Always show logo
always-show-logo yes

# =============================================================================
# SNAPSHOTTING (Persistence for Cache)
# =============================================================================

# Save the DB on disk (disabled for pure cache - using memory only)
# save 900 1
# save 300 10
# save 60 10000

# Stop writes if RDB fails
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Checksum for RDB files
rdbchecksum yes

# RDB filename
# dbfilename dump.rdb

# Working directory
# dir /data

# =============================================================================
# REPLICATION (Master-Slave)
# =============================================================================

# Not used in single instance cache setup
# replicaof <masterip> <masterport>
# masterauth <master-password>

# =============================================================================
# SECURITY
# =============================================================================

# Require clients to issue AUTH <PASSWORD> before processing any other commands
# Set via environment variable REDIS_PASSWORD
# requirepass foobared

# Command renaming (disabled)
# rename-command CONFIG b840fc02d524045429941cc15f59e41cb7be6c52

# =============================================================================
# CLIENTS
# =============================================================================

# Set max number of connected clients at the same time
# Increase for high-traffic scenarios
maxclients 10000

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================

# Set a memory usage limit to max 256mb for cache
# This prevents Redis from consuming all available memory
maxmemory 256mb

# Policy for key eviction when maxmemory is reached
# allkeys-lru: Remove any key using LRU algorithm (best for cache)
maxmemory-policy allkeys-lru

# Sample size for LRU/LFU/TTL algorithms
# Increasing this improves accuracy at the cost of CPU
maxmemory-samples 5

# Replica ignore maxmemory setting
replica-ignore-maxmemory yes

# =============================================================================
# LAZY FREEING (Background deletion)
# =============================================================================

# Use lazy freeing for better performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# =============================================================================
# KERNEL OOM CONTROL
# =============================================================================

# Disable OOM killer for Redis process
oom-score-adj no

# Value for oom-score-adj (only if oom-score-adj is yes)
# oom-score-adj-values 0 200 800

# =============================================================================
# APPEND ONLY MODE (AOF) - Disabled for cache
# =============================================================================

appendonly no
# appendfilename "appendonly.aof"
# appendfsync everysec
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb
# aof-load-truncated yes
# aof-use-rdb-preamble yes

# =============================================================================
# LUA SCRIPTING
# =============================================================================

# Max execution time for Lua scripts (milliseconds)
lua-time-limit 5000

# =============================================================================
# CLUSTER (Disabled for single instance)
# =============================================================================

# cluster-enabled no
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-require-full-coverage yes
# cluster-migration-barrier 1
# cluster-allow-reads-when-down no

# =============================================================================
# SLOW LOG
# =============================================================================

# Log queries slower than 10 milliseconds
slowlog-log-slower-than 10000

# Max number of slow log entries
slowlog-max-len 128

# =============================================================================
# LATENCY MONITOR
# =============================================================================

# Monitor latency events (threshold in milliseconds)
latency-monitor-threshold 0

# =============================================================================
# EVENT NOTIFICATION
# =============================================================================

# Disable all notifications (not needed for cache)
notify-keyspace-events ""

# =============================================================================
# GOPHER SERVER (Disabled)
# =============================================================================

# gopher-enabled no

# =============================================================================
# ADVANCED CONFIG
# =============================================================================

# Hash max ziplist entries
hash-max-ziplist-entries 512

# Hash max ziplist value
hash-max-ziplist-value 64

# List max ziplist size
list-max-ziplist-size -2

# List compression depth
list-compress-depth 0

# Set max intset entries
set-max-intset-entries 512

# Zset max ziplist entries
zset-max-ziplist-entries 128

# Zset max ziplist value
zset-max-ziplist-value 64

# HLL sparse max bytes
hll-sparse-max-bytes 3000

# Stream node max bytes
stream-node-max-bytes 4096

# Stream node max entries
stream-node-max-entries 100

# Client output buffer limit (normal clients)
# client-output-buffer-limit normal 0 0 0

# Client output buffer limit (replica clients)
# client-output-buffer-limit replica 256mb 64mb 60

# Client output buffer limit (pubsub clients)
# client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
# client-query-buffer-limit 1gb

# Proto max bulk len
# proto-max-bulk-len 512mb

# =============================================================================
# ACTIVE DEFRAGMENTATION
# =============================================================================

# activedefrag no
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 5
# active-defrag-cycle-max 75
# active-defrag-max-scan-fields 1000
# jemalloc-bg-thread yes

# =============================================================================
# INCLUDES (Additional config files)
# =============================================================================

# include /path/to/local.conf
# include /path/to/other.conf
