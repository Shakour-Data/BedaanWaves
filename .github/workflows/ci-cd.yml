name: BedaanWaves CI/CD (Native - No Docker)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_type:
        description: 'Deploy type'
        required: true
        default: 'rolling'
        type: choice
        options:
          - rolling
          - blue-green

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run Gitleaks secret scan
      uses: gitleaks/gitleaks-action@v2
      with:
        args: --detect --exit-code 1 --verbose
    
    - name: Run Trivy vulnerability scanner
      uses: aqua-security/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  backend-tests:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio bandit
    
    - name: Run backend tests with coverage
      run: |
        cd backend
        pytest app/tests/ --cov=app --cov-report=xml --cov-report=term --junitxml=test-results.xml
    
    - name: Run mypy type checking
      run: |
        cd backend
        pip install mypy
        mypy app/ --ignore-missing-imports --no-error-summary || true
    
    - name: Run ruff linting
      run: |
        cd backend
        pip install ruff
        ruff check app/ --output-format=github
    
    - name: Run Bandit security scan
      run: |
        cd backend
        bandit -r app/ -f json -o bandit-results.json || true
    
    - name: Install Py-Spy for performance profiling
      run: |
        pip install py-spy
    
    - name: Profile critical paths with Py-Spy
      run: |
        cd backend
        # Profile the dashboard service (most CPU-intensive)
        timeout 30 py-spy record \
          -o dashboard-profile.svg \
          -- python -c "from app.services.analysis.dashboard_service import DashboardService; import asyncio; asyncio.run(DashboardService().get_dimension_dashboard(None, 'technical'))" || true
        
        # Profile the scoring service
        timeout 30 py-spy record \
          -o scoring-profile.svg \
          -- python -c "from app.services.analysis.scoring_service import ScoringService; import asyncio; asyncio.run(ScoringService().compute_scores('AAPL'))" || true
    
    - name: Upload profiling results
      uses: actions/upload-artifact@v4
      with:
        name: performance-profiles
        path: |
          backend/dashboard-profile.svg
          backend/scoring-profile.svg
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: |
          backend/coverage.xml
          backend/test-results.xml
          backend/bandit-results.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  frontend-tests:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run TypeScript type check
      run: |
        cd frontend
        npx tsc --noEmit
    
    - name: Run ESLint
      run: |
        cd frontend
        npx eslint src/ --max-warnings=0
    
    - name: Run unit tests
      run: |
        cd frontend
        npx vitest run --coverage --reporter=json --outputFile=vitest-results.json
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
          frontend/vitest-results.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-artifacts:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    outputs:
      backend_artifact_path: ${{ steps.build.outputs.backend_path }}
      frontend_artifact_path: ${{ steps.build.outputs.frontend_path }}
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Build backend artifact
      id: build
      run: |
        echo "Building BedaanWaves artifacts..."
        
        # Backend
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build
        python -m build --wheel --outdir ../dist-backend
        
        # Frontend
        cd ../frontend
        npm ci
        npm run build
        
        # Package for deployment
        cd ..
        mkdir -p deploy-package/backend deploy-package/frontend
        cp -r backend/dist-backend/* deploy-package/backend/
        cp -r frontend/.next deploy-package/frontend/
        cp -r frontend/public deploy-package/frontend/
        cp frontend/package.json deploy-package/frontend/
        cp frontend/package-lock.json deploy-package/frontend/
        
        # Create tarball
        tar -czf bedaanwaves-${{ github.sha }}.tar.gz -C deploy-package .
        
        echo "backend_path=bedaanwaves-${{ github.sha }}.tar.gz" >> $GITHUB_OUTPUT
        echo "frontend_path=bedaanwaves-${{ github.sha }}.tar.gz" >> $GITHUB_OUTPUT
        echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        
        echo "Build completed successfully"
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package-${{ github.sha }}
        path: bedaanwaves-${{ github.sha }}.tar.gz
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        compression-level: 9

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
    - name: Download deployment artifact
      uses: actions/download-artifact@v4
      with:
        name: deployment-package-${{ github.sha }}
        path: ./
    
    - name: Deploy to staging via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: ${{ secrets.STAGING_SSH_PORT || 22 }}
        script: |
          set -e
          echo "Starting staging deployment..."
          
          # Create deployment directory
          DEPLOY_DIR="/opt/bedaanwaves/staging"
          sudo mkdir -p $DEPLOY_DIR
          sudo chown -R $USER:$USER $DEPLOY_DIR
          
          # Backup current version
          if [ -d "$DEPLOY_DIR/current" ]; then
            echo "Creating backup of current version..."
            mv $DEPLOY_DIR/current $DEPLOY_DIR/previous
            sudo systemctl stop bedaanwaves-staging || true
          fi
          
          # Extract new version
          mkdir -p $DEPLOY_DIR/releases/${{ github.sha }}
          tar -xzf bedaanwaves-${{ github.sha }}.tar.gz -C $DEPLOY_DIR/releases/${{ github.sha }}
          
          # Setup symlink
          ln -sfn $DEPLOY_DIR/releases/${{ github.sha }} $DEPLOY_DIR/current
          
          # Install dependencies
          cd $DEPLOY_DIR/current/backend
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r ../../dist-backend/*.whl || pip install -r requirements.txt
          
          cd $DEPLOY_DIR/current/frontend
          npm ci --production
          
          # Run migrations
          cd $DEPLOY_DIR/current/backend
          source venv/bin/activate
          alembic upgrade head || true
          
          # Update systemd service symlink
          sudo ln -sfn $DEPLOY_DIR/current/backend/-bedanwaves-staging.service /etc/systemd/system/bedaanwaves-staging.service
          sudo systemctl daemon-reload
          
          # Start service
          sudo systemctl enable --now bedaanwaves-staging.service
          
          # Wait for health check
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "Staging deployment successful!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed, rolling back..."
              sudo systemctl stop bedaanwaves-staging
              rm -f $DEPLOY_DIR/current
              ln -sfn $DEPLOY_DIR/previous $DEPLOY_DIR/current
              sudo systemctl start bedaanwaves-staging
              exit 1
            fi
            sleep 2
          done
          
          # Cleanup old releases (keep last 5)
          cd $DEPLOY_DIR/releases
          ls -t | tail -n +6 | xargs -r rm -rf
          
          echo "Staging deployment completed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-artifacts, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - name: Download deployment artifact
      uses: actions/download-artifact@v4
      with:
        name: deployment-package-${{ github.sha }}
        path: ./
    
    - name: Manual approval for production
      uses: trinsic/approval-action@v1
      with:
        message: "Deploy ${{ github.sha }} to production?"
        required-approvers: "ops-team"
    
    - name: Deploy to production via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          echo "Starting production deployment..."
          
          DEPLOY_DIR="/opt/bedaanwaves/production"
          sudo mkdir -p $DEPLOY_DIR
          sudo chown -R $USER:$USER $DEPLOY_DIR
          
          # Blue-Green deployment
          BLUE_DIR="$DEPLOY_DIR/blue"
          GREEN_DIR="$DEPLOY_DIR/green"
          ACTIVE_DIR="$DEPLOY_DIR/active"
          
          # Determine which environment to deploy to
          if [ -L "$ACTIVE_DIR" ] && [ "$(readlink $ACTIVE_DIR)" == "$BLUE_DIR" ]; then
            TARGET_DIR="$GREEN_DIR"
            INACTIVE_DIR="$BLUE_DIR"
          else
            TARGET_DIR="$BLUE_DIR"
            INACTIVE_DIR="$GREEN_DIR"
          fi
          
          echo "Deploying to: $TARGET_DIR"
          
          # Extract new version
          mkdir -p $TARGET_DIR
          tar -xzf bedaanwaves-${{ github.sha }}.tar.gz -C $TARGET_DIR
          
          # Setup environment
          cd $TARGET_DIR/backend
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r ../../dist-backend/*.whl || pip install -r requirements.txt
          
          cd $TARGET_DIR/frontend
          npm ci --production
          
          # Run migrations
          cd $TARGET_DIR/backend
          source venv/bin/activate
          alembic upgrade head || true
          
          # Create systemd service for target
          sudo tee /etc/systemd/system/bedaanwaves-production.service > /dev/null << EOF
[Unit]
Description=BedaanWaves Production Service
After=network.target postgresql.service

[Service]
Type=simple
User=$USER
Group=$USER
WorkingDirectory=$TARGET_DIR/backend
Environment=PATH=$TARGET_DIR/backend/venv/bin
EnvironmentFile=$TARGET_DIR/backend/.env
ExecStart=$TARGET_DIR/backend/venv/bin/uvicorn app.main:app --workers 4 --host 0.0.0.0 --port 3000
Restart=always
RestartSec=3
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
EOF
          
          sudo systemctl daemon-reload
          sudo systemctl enable --now bedaanwaves-production.service
          
          # Health check
          echo "Waiting for production service..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "Production health check passed!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Production health check failed!"
              sudo systemctl stop bedaanwaves-production
              exit 1
            fi
            sleep 2
          done
          
          # Switch traffic (update nginx upstream)
          sudo tee /etc/nginx/sites-available/bedaanwaves > /dev/null << EOF
upstream bedaanwaves_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    
    client_max_body_size 50M;
    
    location /api/v1/ {
        proxy_pass http://bedaanwaves_backend/;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }
}
EOF
          
          sudo nginx -t && sudo systemctl reload nginx
          
          # Switch active symlink
          ln -sfn $TARGET_DIR $ACTIVE_DIR
          
          echo "Production deployment completed successfully!"
          
          # Keep only last 3 releases per environment
          cd $DEPLOY_DIR
          ls -d blue/releases/* 2>/dev/null | sort -V | head -n -3 | xargs -r rm -rf
          ls -d green/releases/* 2>/dev/null | sort -V | head -n -3 | xargs -r rm -rf

  load-testing:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always() && (github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install K6
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q -O - https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar -xz
        sudo mv k6 /usr/local/bin/
    
    - name: Run load test against staging
      run: |
        cd tests/integration/k6
        k6 run \
          --env BASE_URL=https://staging.bedaanwaves.com \
          --env AUTH_TOKEN=${{ secrets.STAGING_AUTH_TOKEN }} \
          --env USERNAME=testuser \
          --env PASSWORD=TestPass123! \
          --config k6-config.json \
          load-test.js
      continue-on-error: false
    
    - name: Upload load test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: |
          tests/integration/k6/results/*
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
    
    - name: Check load test thresholds
      run: |
        cd tests/integration/k6
        # Parse k6 JSON output and verify thresholds
        if [ -f k6-results.json ]; then
          echo "Load test completed, checking results..."
          # Additional threshold validation can be added here
        fi